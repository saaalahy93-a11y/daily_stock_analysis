name: List available AI models

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini models available to this key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
          | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(m["name"].removeprefix("models/")) for m in d.get("models",[]) if "generateContent" in m.get("supportedGenerationMethods",[])]; print("error:", d.get("error")) if "error" in d else None'
